<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a5f"/><stop offset="1" stop-color="#ff3d6b"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101014"/><stop offset="1" stop-color="#0b0b0f"/></linearGradient>
    <g id="mark">
      <rect x="2.5" y="10" width="16" height="16" rx="4.2" fill="none" stroke="#9298a3" stroke-width="1.6" opacity=".5"/>
      <rect x="11" y="5" width="18" height="18" rx="4.8" fill="url(#g)"/>
      <path d="M17 9.5 L17 18.5 L23.5 14 Z" fill="#fff"/>
    </g>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="6" fill="url(#g)"/>

  <g transform="translate(600,120)"><use href="#mark" transform="scale(2.6)"/></g>
  <text x="640" y="250" fill="#f4f5f8" font-size="46" font-weight="700" letter-spacing="-1" text-anchor="middle">3 adımda birlikte izle</text>

  <!-- 3 step cards -->
  <g transform="translate(120,320)">
    <rect width="320" height="300" rx="20" fill="#17171d" stroke="rgba(255,255,255,.09)"/>
    <circle cx="46" cy="56" r="24" fill="url(#g)"/><text x="46" y="64" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <text x="30" y="140" fill="#edeef2" font-size="24" font-weight="700">Oda oluştur</text>
    <text x="30" y="180" fill="#9298a3" font-size="18">Video sayfasındayken tek</text>
    <text x="30" y="206" fill="#9298a3" font-size="18">tık — davet linki kopyalanır.</text>
  </g>
  <g transform="translate(480,320)">
    <rect width="320" height="300" rx="20" fill="#17171d" stroke="rgba(255,255,255,.09)"/>
    <circle cx="46" cy="56" r="24" fill="url(#g)"/><text x="46" y="64" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">2</text>
    <text x="30" y="140" fill="#edeef2" font-size="24" font-weight="700">Linki gönder</text>
    <text x="30" y="180" fill="#9298a3" font-size="18">Arkadaşın tıklayınca aynı</text>
    <text x="30" y="206" fill="#9298a3" font-size="18">odaya ve bölüme düşer.</text>
  </g>
  <g transform="translate(840,320)">
    <rect width="320" height="300" rx="20" fill="#17171d" stroke="rgba(255,255,255,.09)"/>
    <circle cx="46" cy="56" r="24" fill="url(#g)"/><text x="46" y="64" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">3</text>
    <text x="30" y="140" fill="#edeef2" font-size="24" font-weight="700">Birlikte izle</text>
    <text x="30" y="180" fill="#9298a3" font-size="18">Oynat, durdur, sar — hepsi</text>
    <text x="30" y="206" fill="#9298a3" font-size="18">herkeste eşitlenir.</text>
  </g>

  <text x="640" y="700" fill="#6b7280" font-size="17" text-anchor="middle">PERCEPT tarafından geliştirildi · tamamen P2P · reklamsız</text>
</svg>
