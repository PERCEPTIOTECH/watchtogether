<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a5f"/><stop offset="1" stop-color="#ff3d6b"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101014"/><stop offset="1" stop-color="#0b0b0f"/></linearGradient>
    <linearGradient id="vid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0a0d13"/></linearGradient>
    <g id="mark">
      <rect x="2.5" y="10" width="16" height="16" rx="4.2" fill="none" stroke="#9298a3" stroke-width="1.6" opacity=".5"/>
      <rect x="11" y="5" width="18" height="18" rx="4.8" fill="url(#g)"/>
      <path d="M17 9.5 L17 18.5 L23.5 14 Z" fill="#fff"/>
    </g>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="6" fill="url(#g)"/>

  <!-- Headline -->
  <text x="64" y="96" fill="#f4f5f8" font-size="40" font-weight="700" letter-spacing="-1">Arkadaşınla aynı videoyu, aynı an.</text>
  <text x="64" y="132" fill="#9298a3" font-size="20">Senkron oynat/durdur/sar · sesli, kameralı ve yazılı sohbet · her sitede</text>

  <!-- Video area -->
  <rect x="64" y="176" width="740" height="500" rx="18" fill="url(#vid)"/>
  <circle cx="434" cy="410" r="52" fill="rgba(255,255,255,.12)"/>
  <path d="M420 384 L420 436 L462 410 Z" fill="#fff"/>
  <rect x="104" y="600" width="520" height="10" rx="5" fill="rgba(255,255,255,.14)"/>
  <rect x="104" y="600" width="300" height="10" rx="5" fill="url(#g)"/>
  <text x="104" y="228" fill="#c7ccd6" font-size="18" font-weight="600">The Blacklist · S1E2</text>

  <!-- Panel -->
  <g transform="translate(852,80)">
    <rect width="364" height="640" rx="20" fill="#17171d" stroke="rgba(255,255,255,.09)"/>
    <!-- header -->
    <g transform="translate(20,20)"><use href="#mark" transform="scale(1.15)"/></g>
    <text x="68" y="36" fill="#edeef2" font-size="17" font-weight="700">WatchTogether</text>
    <circle cx="70" cy="50" r="4" fill="#2ee6a0"/><text x="80" y="55" fill="#9298a3" font-size="13">bağlı · 2 kişi</text>
    <line x1="0" y1="76" x2="364" y2="76" stroke="rgba(255,255,255,.09)"/>

    <!-- player -->
    <g transform="translate(20,96)">
      <rect width="40" height="40" rx="11" fill="url(#g)"/><path d="M14 12 L14 28 L27 20 Z" fill="#fff"/>
      <text x="54" y="26" fill="#9298a3" font-size="13">25:50</text>
      <rect x="96" y="18" width="150" height="5" rx="3" fill="rgba(255,255,255,.12)"/>
      <rect x="96" y="18" width="92" height="5" rx="3" fill="url(#g)"/>
      <circle cx="188" cy="20" r="7" fill="#fff"/>
      <text x="256" y="26" fill="#9298a3" font-size="13">40:58</text>
    </g>
    <!-- badge -->
    <rect x="20" y="150" width="324" height="34" rx="9" fill="rgba(46,230,160,.1)" stroke="rgba(46,230,160,.4)"/>
    <circle cx="38" cy="167" r="5" fill="#2ee6a0"/><text x="52" y="172" fill="#edeef2" font-size="13">Eşitlendi · oynatılıyor</text>

    <!-- users -->
    <text x="20" y="220" fill="#9298a3" font-size="12" font-weight="700" letter-spacing="1">KATILIMCILAR 2</text>
    <g transform="translate(20,236)">
      <circle cx="16" cy="16" r="16" fill="url(#g)"/><text x="16" y="21" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">SE</text>
      <text x="44" y="14" fill="#edeef2" font-size="14">Sen (sen)</text>
      <text x="44" y="30" fill="#2ee6a0" font-size="11">senkron · aynı videoda</text>
    </g>
    <g transform="translate(20,284)">
      <circle cx="16" cy="16" r="16" fill="#38bdf8"/><text x="16" y="21" fill="#04121a" font-size="12" font-weight="700" text-anchor="middle">KA</text>
      <text x="44" y="14" fill="#edeef2" font-size="14">Kanka</text>
      <text x="44" y="30" fill="#2ee6a0" font-size="11">senkron · aynı videoda</text>
    </g>

    <!-- camera tiles -->
    <rect x="20" y="336" width="158" height="96" rx="12" fill="#0a0b0f" stroke="rgba(46,230,160,.6)"/>
    <circle cx="99" cy="376" r="22" fill="url(#g)"/><text x="99" y="382" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">S</text>
    <rect x="186" y="336" width="158" height="96" rx="12" fill="#0a0b0f" stroke="rgba(255,255,255,.09)"/>
    <circle cx="265" cy="376" r="22" fill="#38bdf8"/><text x="265" y="382" fill="#04121a" font-size="15" font-weight="700" text-anchor="middle">K</text>

    <!-- cta -->
    <rect x="20" y="456" width="324" height="46" rx="12" fill="url(#g)"/>
    <text x="182" y="484" fill="#fff" font-size="15" font-weight="600" text-anchor="middle">Davet et</text>

    <!-- chat -->
    <rect x="20" y="522" width="230" height="34" rx="12" fill="#22232b"/><text x="36" y="543" fill="#c7ccd6" font-size="13">şu sahne efsane ya</text>
    <rect x="140" y="566" width="204" height="34" rx="12" fill="url(#g)"/><text x="330" y="587" fill="#fff" font-size="13" text-anchor="end">geri sarayım mı</text>
  </g>
</svg>
