# WatchTogether — coturn TURN sunucusu yapılandırması.
# Katı NAT / güvenlik duvarındaki kullanıcıların da bağlanmasını sağlar.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# Uzun-vadeli kimlik (bunu DEĞİŞTİR — güçlü bir şifre koy)
user=watchtogether:DEGISTIR_GUCLU_SIFRE
realm=watchtogether

# VPS'in PUBLIC IP'si (zorunlu) — yorumdan çıkar, kendi IP'ni yaz
# external-ip=SENIN_PUBLIC_IP

# Relay port aralığı (firewall'da UDP olarak AÇ)
min-port=49152
max-port=65535

no-multicast-peers
no-cli
stale-nonce=600

# (Opsiyonel) TLS için sertifika — turns:// kullanmak istersen
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
